name: Nightly fuzz

# Fuzzes untrusted formulas and workbooks (CLAUDE.md directive 5; T-0021, decision 0035).
# A crash, timeout or out-of-memory fails the job and uploads only the offending inputs; the
# steward files one task per distinct crash (docs/process/agent-workflow.md).
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: formula_parse
            args: -dict=dict/formula.dict -max_len=512
          - target: formula_eval
            args: -dict=dict/formula.dict -max_len=512
          - target: xlsx_import
            args: -max_len=1048576
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The corpus libFuzzer grew on earlier nights; seeds from the suites are added on top. `v2`:
      # the caches saved before T-3163 hold every suite formula (802,100 files) and are not restored.
      - uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-v2-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-v2-${{ matrix.target }}-
      - run: python3 fuzz/seed_corpus.py
      # cargo-fuzz defaults --target to the triple it was built for; the prebuilt binary is musl,
      # which the nightly toolchain lacks and ASan does not support. Fuzz the host (glibc) triple.
      # ASan keeps every distinct allocation stack trace in its stack depot for the life of the
      # process, so its RSS grows with the inputs fuzzed while the live heap stays small; that hit
      # the 2 GiB limit (T-1220). Not recording allocation stacks keeps RSS flat (decision 0046).
      - name: fuzz for 20 minutes
        working-directory: fuzz
        env:
          ASAN_OPTIONS: malloc_context_size=0
        run: >-
          cargo fuzz run --target "$(rustc -vV | sed -n 's/^host: //p')"
          ${{ matrix.target }} corpus/${{ matrix.target }} --
          ${{ matrix.args }} -max_total_time=1200 -timeout=30 -rss_limit_mb=2048
          -print_final_stats=1
      # Keep only inputs that add coverage (libFuzzer's -merge=1), so the corpus saved is bounded by
      # the target's coverage, not by the number of nights, and the next night's first pass stays
      # short (T-3163).
      - name: minimize the corpus
        working-directory: fuzz
        env:
          ASAN_OPTIONS: malloc_context_size=0
        run: >-
          cargo fuzz cmin --target "$(rustc -vV | sed -n 's/^host: //p')"
          ${{ matrix.target }} corpus/${{ matrix.target }} --
          ${{ matrix.args }} -timeout=30 -rss_limit_mb=2048
      # Only runs on main grow the shared corpus (decision 0035).
      - name: save the grown corpus
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-v2-${{ matrix.target }}-${{ github.run_id }}
      - name: upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
