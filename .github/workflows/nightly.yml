name: Nightly eval

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      # External (fetched, non-vendored) suites are downloaded here once their fetchers exist (T-0006).
      - run: make eval
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-${{ github.run_id }}
          path: eval/runs/latest/
