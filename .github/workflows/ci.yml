name: CI

on:
  pull_request:
  # Decision 0053: the merge queue tests each group merged with current main; every job runs.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Decision 0049: a PR that touches only docs skips the rust, eval and python jobs. A skipped job
  # reports success to required checks, so this job decides safely: anything it cannot
  # classify, every push to main and every merge-queue group (decision 0053) runs everything.
  # The rules live in scripts/ci_changes.py (tested by make hygiene); decision 0066 runs the copy
  # from the PR's base commit, so a PR cannot change how its own files are classified.
  changes:
    name: changes (docs-only?)
    runs-on: ubuntu-latest
    outputs:
      # The heavy jobs run unless this is exactly 'false': a failed or skipped classification step
      # gives 'true', and a job that never ran leaves it empty.
      run_heavy: ${{ steps.diff.outcome == 'success' && steps.diff.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          : > "$RUNNER_TEMP/changed"
          # --no-renames lists both sides of a rename, so moving code into docs/ still counts as
          # code; -z keeps unusual file names intact. Every failure leaves code=true.
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE" ] \
            && git show "$BASE:scripts/ci_changes.py" > "$RUNNER_TEMP/ci_changes.py" \
            && git diff -z --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed" \
            && out=$(python3 -I "$RUNNER_TEMP/ci_changes.py" < "$RUNNER_TEMP/changed") \
            && [ "$out" = "code=false" ]; then
            code=false
          fi
          # File names are attacker-controlled: never echo them raw (workflow-command injection).
          echo "changed files: $(tr -cd '\0' < "$RUNNER_TEMP/changed" | wc -c), code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  rust:
    name: rust (fmt, clippy, test)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make fmt-check
      - run: make clippy
      - run: make test

  eval:
    name: eval (Excel-compatibility gate)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - run: make eval-check
      - run: make evidence-floor
      # Decision 0054: the report reruns every suite (about 2.5 min). PRs and merge groups only need it
      # to debug a failed gate; main keeps one per merge.
      - name: Full report (informational)
        if: ${{ failure() || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: make eval
      - uses: actions/upload-artifact@v4
        if: ${{ failure() || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        with:
          name: eval-report
          path: eval/runs/latest/
          if-no-files-found: ignore

  python:
    name: python (tools + bindings)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: make py-check
      - run: make py-bindings

  hygiene:
    name: hygiene (ratchets, deny, machete, typos, governance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,typos-cli
      - run: make hygiene
      - run: make deny
      - run: make machete
      - run: make typos
      - name: governance
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_governance.py origin/${{ github.base_ref }}
