name: CI

on:
  pull_request:
  # Decision 0053: the merge queue tests each group merged with current main; every job runs.
  merge_group:
  # Decision 0147 (SPEC-0027 section 9): the merge train's two branches, by literal name, so
  # merge-train/revert-* and merge-train/probe start nothing (scripts/test_check_ci_workflow.py).
  push:
    branches: [main, merge-train/current, merge-train/shadow]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Decision 0049: a PR that touches only docs skips the rust, eval and python jobs. A skipped job
  # reports success to required checks, so this job decides safely: anything it cannot
  # classify, every push to main and every merge-queue group (decision 0053) runs everything.
  # The rules live in scripts/ci_changes.py (tested by make hygiene); decision 0066 runs the copy
  # from the PR's base commit, so a PR cannot change how its own files are classified.
  # Decision 0147 keys it on github.ref: a PR diffs from the merge base of its base and head shas
  # to its head, a merge-train push or dispatch from the merge base of origin/main and HEAD (the
  # classifier read from that base); every other ref runs everything.
  changes:
    name: changes (docs-only?)
    runs-on: ubuntu-24.04
    outputs:
      # The heavy jobs run unless this is exactly 'false': a failed or skipped classification step
      # gives 'true', and a job that never ran leaves it empty.
      run_heavy: ${{ steps.diff.outcome == 'success' && steps.diff.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          # from/to: ci_changes.py diffs the single merge base of the two to `to` (it requires
          # exactly one, and a full clone). src: the commit whose classifier runs (decision 0066).
          from='' to='' src=''
          case "$REF" in
            refs/heads/merge-train/current | refs/heads/merge-train/shadow)
              from=origin/main to=HEAD
              src=$(git merge-base origin/main HEAD) || src='' ;;
            *)
              if [ "$EVENT" = "pull_request" ]; then from=$BASE to=$PR_HEAD src=$BASE; fi ;;
          esac
          # Every failure leaves code=true. A base whose classifier predates --merge-base reads
          # the empty stdin and says code=true.
          if [ -n "$from" ] && [ -n "$to" ] && [ -n "$src" ] \
            && git show "$src:scripts/ci_changes.py" > "$RUNNER_TEMP/ci_changes.py" \
            && out=$(python3 -I "$RUNNER_TEMP/ci_changes.py" --merge-base "$from" "$to" < /dev/null) \
            && [ "$out" = "code=false" ]; then
            code=false
          fi
          # File names are attacker-controlled: ci_changes.py logs only their count.
          echo "event=$EVENT code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Decision 0122: `make test` runs as two shards in parallel (the engine's unit tests took about
  # 4.5 of the job's 6-7 minutes). `make test-shard-1` and `make test-shard-2` together run exactly
  # the tests `make test` runs (see the Makefile); fmt and clippy run beside shard 1.
  rust:
    name: ${{ matrix.shard == 1 && 'rust (fmt, clippy, test 1/2)' || 'rust (test 2/2)' }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' }}
    runs-on: ubuntu-24.04
    strategy:
      # Each shard reports its own failures.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      # Shard 1 also caches clippy's artifacts; one key per shard keeps either from overwriting
      # the other's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-shard-${{ matrix.shard }}
      - if: matrix.shard == 1
        run: make fmt-check
      - if: matrix.shard == 1
        run: make clippy
      - run: make test-shard-${{ matrix.shard }}

  # Decision 0122: one stable check name for both shards, so a required check (decision 0053's
  # list) never names a matrix job. A skipped matrix job reports under its unexpanded name
  # template, and a shard count change would rename the checks. always(), not !cancelled(): a
  # skipped required check counts as passed, so a cancelled run must report a failure here.
  rust-all:
    name: rust (fmt, clippy, test)
    needs: [changes, rust]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.rust.result }}
          RUN_HEAVY: ${{ needs.changes.outputs.run_heavy }}
        run: |
          echo "rust shards: $RESULT, run_heavy=$RUN_HEAVY"
          if [ "$RESULT" = "success" ]; then exit 0; fi
          # A docs-only PR (decision 0049) skips the shards on purpose.
          if [ "$RESULT" = "skipped" ] && [ "$RUN_HEAVY" = "false" ]; then exit 0; fi
          exit 1

  eval:
    name: eval (Excel-compatibility gate)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      # Decision 0125: one run of the suites judges both the baseline gate (eval-check) and the
      # evidence floor; running them as two steps rebuilt the release binary and reran the suites.
      - run: make eval-gates
      # Decision 0054: the report reruns every suite (about 2.5 min). PRs, merge groups, merge trains
      # and dispatches on other branches only need it to debug a failed gate (decision 0147); main
      # keeps one per merge.
      - name: Full report (informational)
        if: ${{ failure() || github.ref == 'refs/heads/main' }}
        run: make eval
      - uses: actions/upload-artifact@v4
        if: ${{ failure() || github.ref == 'refs/heads/main' }}
        with:
          name: eval-report
          path: eval/runs/latest/
          if-no-files-found: ignore

  python:
    name: python (tools + bindings)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: make py-check
      - run: make py-bindings

  hygiene:
    name: hygiene (ratchets, deny, machete, typos, governance)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,typos-cli
      - run: make hygiene
      - run: make deny
      - run: make machete
      - run: make typos
      - name: governance
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_governance.py origin/${{ github.base_ref }}
