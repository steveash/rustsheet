[files]
extend-exclude = [
  "crates/rustsheet-engine/src/language/",
  "crates/rustsheet-engine/src/locale/",
  "crates/rustsheet-engine/src/functions/engineering/",
  "crates/rustsheet-engine/src/test/",
  "crates/rustsheet-xlsx/tests/",
  "tools/upstream/",
  "eval/baseline/",
  "eval/suites/",
  "docs/research/",
  "*.xlsx",
  "*.lock",
]

[default]
# C99 hex-float literals (0x1.79f85ba68804p-4) in comments citing research coefficients.
# Generated eval case ids (16 lowercase hex digits, e.g. 4ab2ba98d26c8a5e) cited as evidence.
extend-ignore-re = ["-?0x[0-9a-fA-F]\\.[0-9a-fA-F]+p[-+]?[0-9]+", "\\b[0-9a-f]{16}\\b"]

[default.extend-words]
# Excel function names and spreadsheet jargon
ue = "ue"
iif = "iif"
# Excel's short Saka Monday, `[$-100409]ddd` (number-formats.md, T-2779)
Som = "Som"
# T-1941 probe case names (kmyst-gam-*)
gam = "gam"
# TOMS 708 routine names bgrat / grat1 (incomplete beta and gamma, statistics.md T-2464, T-2512)
grat = "grat"
# Excel function names / foreign-language function names that look like typos
Permut = "Permut"
permut = "permut"
PERMUT = "PERMUT"
PERMUTATIONA = "PERMUTATIONA"
Averageifs = "Averageifs"
averageifs = "averageifs"
AVERAGEIFS = "AVERAGEIFS"
Formattings = "Formattings"
FALSO = "FALSO"
ttest = "ttest"
TTEST = "TTEST"
Singl = "Singl"
nd = "nd"
SEMS = "SEMS"
Beng = "Beng"
VALU = "VALU"
unparseable = "unparseable"
ment = "ment"
thm = "thm"
startd = "startd"
# Upstream ironcalc test workbook name (ROW_COLUM.xlsx), cited in docs
COLUM = "COLUM"
endd = "endd"
# Data identifiers cited in docs: a defined-name prefix in poi/46535.xlsx and a probe test string
HSI = "HSI"
abd = "abd"

[default.extend-identifiers]
# Upstream ironcalc test workbook name (ENGINEERING/COMPLEXs.xlsx), cited in docs
COMPLEXs = "COMPLEXs"
