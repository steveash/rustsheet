<svg xmlns="http://www.w3.org/2000/svg" width="760" height="234" viewBox="0 0 760 234" role="img" aria-labelledby="t d">
<title id="t">Functions per bucket</title><desc id="d">505 functions, each in the bucket of its worst checked cell.</desc>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px}.title{font-size:15px;font-weight:600}.num{font-variant-numeric:tabular-nums}.bg{fill:#ffffff}.ink{fill:#1f2328}.muted{fill:#59636e}.grid{fill:#d1d9e0}.b-pass{fill:#2a78d6}.b-ulp1{fill:#1baf7a}.b-ulp4{fill:#eda100}.b-close{fill:#6250d6}.b-off{fill:#e34948}.in-pass{fill:#000000}.in-ulp1{fill:#000000}.in-ulp4{fill:#000000}.in-close{fill:#ffffff}.in-off{fill:#000000}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.ink{fill:#f0f6fc}.muted{fill:#9198a1}.grid{fill:#3d444d}.b-pass{fill:#3987e5}.b-ulp1{fill:#199e70}.b-ulp4{fill:#c98500}.b-close{fill:#9085e9}.b-off{fill:#e66767}.in-pass{fill:#000000}.in-ulp1{fill:#000000}.in-ulp4{fill:#000000}.in-close{fill:#000000}.in-off{fill:#000000}}</style>
