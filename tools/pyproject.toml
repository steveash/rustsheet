[project]
name = "rustsheet-tools"
version = "0.1.0"
description = "RustSheet tooling: Excel oracle client, spec→xlsx builder, synthetic workbook generator"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "msal>=1.28",
  "requests>=2.31",
  "xlsxwriter>=3.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
windows = ["pywin32>=306; sys_platform == 'win32'"]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "types-requests", "types-PyYAML", "openpyxl>=3.1"]

[project.scripts]
rustsheet-oracle = "rustsheet_tools.oracle.cli:main"
rustsheet-spec2xlsx = "rustsheet_tools.spec2xlsx:main"
rustsheet-gen = "rustsheet_tools.gen.cli:main"
rustsheet-catalog-view = "rustsheet_tools.catalog_view:main"
rustsheet-fitlab = "rustsheet_tools.fitlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rustsheet_tools"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N", "S", "C4", "PTH", "RET", "ARG"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "S101", "S311", "S603", "S607", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["rustsheet_tools"]

[[tool.mypy.overrides]]
module = ["msal", "xlsxwriter", "xlsxwriter.*", "win32com", "win32com.*", "openpyxl"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
