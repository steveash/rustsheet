# RustSheet function catalog (v0). Machine-readable signatures that drive the synthetic
# generator, coverage tracking and milestone scoping. Schema: docs/architecture/synthetic-generator.md.
#
# Parameter `mode` (how Excel coerces the argument; this matters for parity):
#   value      scalar; references are dereferenced; text that looks numeric is coerced in arithmetic
#   aggregate  numbers in ranges counted, text/bools/blanks in ranges ignored; direct scalars coerced
#   aggregate_a  like aggregate but text counts as 0 and TRUE as 1 (the "A" functions)
#   range      must be a reference/range (e.g. lookup table, criteria range)
#   criteria   criteria string or value ("">5"", ""=a*"", 3)
#   array      ranges and arrays are taken whole, never lifted or intersected; how blanks, text and
#              booleans inside count is the function's own rule (MDETERM, GCD and SERIESSUM: text or
#              a boolean is #VALUE!; SUMPRODUCT: it is 0). docs/excel-semantics/arrays.md,
#              probes/math-argument-modes.
#   any        any value
# `repeat: true` marks the trailing repeating param; `repeat: {group: [a, b], min, max}` on the first
# member marks a repeating group of params (SUMIFS criteria_range/criteria pairs). Types: number | text | bool | any.
#
# milestone: the first milestone in which the function is in scope for the gate.
# prior: relative real-world frequency (Enron/EUSES/FUSE-derived, see research report). Most
#   functions have no published corpus share; theirs is hand-set relative to the M2 priors
#   (docs/architecture/synthetic-generator.md 1.1: SUBTOTAL is in Enron's top 15).
# volatile: true marks a function whose value changes on every recalculation (RAND, RANDBETWEEN).
#   It keeps its signature, but the generator never calls it: no oracle value could match.
#
# The catalog lists every Microsoft 365 Excel (en-US) function (T-0040). Names and minimum
# argument counts come from eval/catalog/excel-functions.tsv, the vetted copy of Microsoft's
# function list with its provenance; tools/tests/test_catalog.py keeps the two in step.
# The eval harness reads names, milestones, scope and oracle from the generated eval/catalog/scope.json
# (decision 0040): after editing, run `cd tools && uv run rustsheet-catalog-view`.
# Entries with `params` are generator-ready signatures (the M2 block, then the M5 math ones in
# alphabetical place, T-1082). The rest (one line each) carry only these fields until a milestone needs their signature:
#   category   functional family: math, logical, text, information, web, addin (M5); lookup, date (M6);
#              statistical, financial, engineering, database, cube (M9). Compatibility functions take
#              their family (CEILING/FLOOR math, the rest statistical).
#   milestone  the category's milestone, except the docs/milestones.md scope lists that name a function:
#              TODAY, NOW (M2) and the dynamic-array and LAMBDA families (M7: FILTER, SORT, SORTBY, UNIQUE,
#              SEQUENCE, RANDARRAY, LET, LAMBDA, MAP, REDUCE, SCAN, MAKEARRAY, BYROW, BYCOL, ISOMITTED,
#              TEXTSPLIT, TEXTBEFORE, TEXTAFTER, VSTACK, HSTACK, TAKE, DROP, WRAPROWS, WRAPCOLS, TOCOL, TOROW,
#              EXPAND, GROUPBY, PIVOTBY, REGEX*).
#   scope      in | out. `out` (with `reason`) = the result depends on systems outside the workbook.
#              That is decision 0027's principle, applied beyond its named list where the same
#              reason holds (IMPORTCSV/IMPORTTEXT read external files, which CLAUDE.md directive 5
#              also forbids during evaluation). Entries without `scope` (the M2 signatures) are in.
#              SQL.REQUEST (in decision 0027's list) is absent: Microsoft no longer lists it and
#              its page is gone, so it is not a current Excel function.
#   oracle     none = the excel-graph oracle cannot return any value for the function (today
#              INFO and SHEETS: the canary refuses workbooks that call them). A web value, error
#              values included, is a golden (decision 0039), so a function that is #NAME? or
#              fails on the web is not `none`. Absent = the oracle evaluates it
#              (probes/catalog/availability-*).

