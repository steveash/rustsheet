name = "calipers"
description = "Calipers, the mog engine's verification corpus: Excel-saved goldens (real financial models, round trips, Office.js outputs) recalculated and scored against their cached values (T-0446)"
kind = "xlsx"
root = "../../.cache/suites/calipers"
# Every Excel golden. `pv_goldens/` holds 107 real financial models; `roundtrip/`, `recalculate/`,
# `default/`, `scratch/` and `officejs/` hold Excel's saves of authored fixtures and of Office.js
# script runs (the engine cannot run the scripts, but their saved workbooks are ordinary Excel files).
include = ["**/golden.xlsx"]
# `_disabled/`: hostile files Calipers itself never loads. pv26_002 and pv26_2_002 (1.4M formulas,
# 560k COUNTIFS/SUMIFS) take about 11 minutes to calculate, and a timed-out case keeps its worker
# running until the run ends; T-0449 puts them back once they calculate within the case timeout.
# pv26_001 and pv26_2_001 (134k formulas) take 17 s to load and about 32 s in all, enough to push
# them and other suites' heavy cases past the timeout in a parallel run; T-0450 puts them back.
exclude = [
  "_disabled/**",
  "pv_goldens/pv26_002/**",
  "pv_goldens/pv26_2_002/**",
  "pv_goldens/pv26_001/**",
  "pv_goldens/pv26_2_001/**",
]
# Calipers is MIT. The pv_goldens workbooks were imported into it from a non-public repository
# (lyfegame/shortcut, anonymised by its authors), so the corpus is fetched, never vendored.
license = "MIT"
origin = "https://github.com/fundamental-research-labs/calipers (verification/cases)"
use_cached_values = true
require_excel_authored = true
# Not in `make check`: with its ~1.4M scored cells in the same parallel run, corpus-bench's heavy
# workbooks (59969, 68-47) passed the 60 s case timeout in 2 of 3 runs (T-0446). It keeps its cell
# baseline: `rustsheet-eval check --suite calipers` gates it and
# `rustsheet-eval update-baseline --suite calipers` ratchets it; `make eval` reports it.
gate = false
baseline = "cells"
milestone = ["M11"]
# Kept subnormals Excel saves as 0, scored against excel-graph probes (decisions 0032, 0090; T-2714).
cached_overrides = "cached-overrides.tsv"

[fetch]
url = "https://github.com/fundamental-research-labs/calipers.git"
rev = "9e47ea4fc97b292b15ff7bf3c445acab53f6d8e9"
subdir = "verification/cases"
include = ["**/golden.xlsx"]
