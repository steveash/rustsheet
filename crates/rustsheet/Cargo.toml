[package]
name = "rustsheet"
description = "RustSheet public API: a typed facade over the calculation engine"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rustsheet_engine = { path = "../rustsheet-engine" }
rustsheet_xlsx = { path = "../rustsheet-xlsx" }
thiserror = "1"

[dev-dependencies]
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
# Lets the eval harness pin the workbook clock to IronCalc's METADATA `NOW` convention
# (see `Workbook::pin_clock_from_metadata`).
metadata_clock = []

[lints]
workspace = true

[[bench]]
name = "edit"
harness = false

[[bench]]
name = "aggregate"
harness = false

[[bench]]
name = "text"
harness = false

[[bench]]
name = "lift"
harness = false

[[bench]]
name = "math_lift"
harness = false
