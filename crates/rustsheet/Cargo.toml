[package]
name = "rustsheet"
description = "RustSheet public API: a typed facade over the calculation engine"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rustsheet_engine = { path = "../rustsheet-engine" }
rustsheet_xlsx = { path = "../rustsheet-xlsx" }
thiserror = "1"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[features]
# Exposes `Workbook::from_engine_model` (an engine type in a signature) for the eval harness
# until spec workbooks can be built through `edit` (T-0103). Never enable in bindings.
engine-model = []
# Lets the eval harness pin NOW()/TODAY() (see `Workbook::pin_clock_from_metadata`).
mock_time = ["rustsheet_engine/mock_time", "rustsheet_xlsx/mock_time"]

[lints]
workspace = true
