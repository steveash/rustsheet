[package]
name = "rustsheet_eval"
description = "Excel-compatibility evaluation harness for RustSheet"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rustsheet-eval"
path = "src/main.rs"

[dependencies]
rustsheet_engine = { path = "../rustsheet-engine" }
# `metadata_clock` pins a workbook's clock to its METADATA `NOW` row (SPEC-0008).
rustsheet = { path = "../rustsheet", features = ["metadata_clock", "harness_row_insert"] }
rustsheet_xlsx = { path = "../rustsheet-xlsx" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
quick-xml = "0.42"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
walkdir = "2"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
